<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>
    <style>
        *{ 
            padding: 0;
            margin: 0;
        }
        .pad{
            height: 50px;
            width: 50px;
            padding: 2px;
        }
        #first{
            
            margin: 5px 5px 5px 5px;
            background-color: red;
             /* top right bottom left*/  /* margin>border>padding>content */
        }
        #second{
            
            margin: 5px 5px 5px 5px;
            background-color: greenyellow;
             
        }
    </style>
</head>
<body>
    <div id="first" class="pad">First</div>
    <div id="second" class="pad">Second</div>
</body>
</html>
