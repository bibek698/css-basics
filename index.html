<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            position: relative;
            top: 50px;
            left: 50px;
            transform: rotate(45deg);

        }
    </style>
</head>

<body>

    <div class="box">Rotate</div>
    
    
</body>
</html>
