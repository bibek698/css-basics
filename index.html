<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice set 4</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        #btn{
            background-color: red;
            height: 100px;
            width: 100px;
        }
        #click-btn{
            padding: 10px 15px 10px 15px;
            margin: 100px;
            border: 5px dotted red;
            border-radius: 40px;
        }
        .new{
            height: 50px;
            width: 50px;
            background-color: red;
            padding: 5px;
            margin: 10px;
        }
        #first{
            box-sizing: content-box;
        }
        #second{
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="btn">Button</div>
    <button id="click-btn">
        click me
    </button>

    <div id="first" class="new">first</div>
    <div id="second" class="new">second</div>
</body>
</html>
