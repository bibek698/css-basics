<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>

    <style>
        #text1{
            text-transform: capitalize;
        }
        #text2{
            text-transform: uppercase;
            
        }
        #text3{
            text-transform: lowercase;
            
        }
           </style>
</head>
<body>
    <h1 id="text1">This is text</h1>
    <h1 id="text2">This is text2</h1>
    <h1 id="text3">This is text3</h1>

</body>
</html>
