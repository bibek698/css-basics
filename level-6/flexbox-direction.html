<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Property</title>
    <style>
       
        #heading{
            text-align: center;
            margin-top: 20px;
        }
        #container{
            height: 500px;
            width: 60%;
            border: 1px solid black;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            align-items: center; /* align items to the center of the container  around cross axis */
            align-content: center; 
        }
        .box{
            height: 150px;
            width: 150px;
            background-color: lightblue;
            margin: 10px;
            
        }
        /* main axis is left to right and cross axis is top to bottom. when we apply float right to the box, it will be taken out of the normal flow and will be aligned to the right side of the container. the main axis will be from left to right and the cross axis will be from top to bottom. the box will be placed on the right side of the container and will be aligned to the top of the container. */
    </style>
</head>
<body>
    <h1 id="heading">Flex Container</h1>
    <div id="container">
        <div id="box1" class="box">Flex item 1</div>
        <div id="box2" class="box">Flex item 2</div>
        <div id="box3" class="box">Flex item 3</div>
        <div id="box4" class="box">Flex item 4</div>
        <div id="box5" class="box">Flex item 5</div>
        <div id="box6" class="box">Flex item 6</div>
        
    </div>
</body>
</html>
