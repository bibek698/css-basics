<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
<style>
    .box {
        padding: 50px;
        width: 100px;
        height: 100px;
        background-color: red;
    }

    @media screen and(max-width: 400px){
        .box{
            width: 400px;
        height: 400px;
        }
    }

  
   
</style>
</head>
<body>
    <div class="box">Box</div>
    
</body>
</html>
