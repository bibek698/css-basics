<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Property</title>
    <style>
       
        #heading{
            text-align: center;
            margin-top: 20px;
        }
        #container{
            height: 500px;
            width: 60%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
             /* align items to the center of the container  around cross axis */
            
        }
        .box{
            height: 150px;
            width: 150px;
            background-color: lightblue;
            margin: 10px;
            flex-grow: 1;
            
        }
       #box2{
        /* align the second box to the end of the container */
        flex-grow: 2;
       }    </style>
</head>
<body>
    <h1 id="heading">Flex Container</h1>
    <div id="container">
        <div id="box1" class="box">Flex item 1</div>
        <div id="box2" class="box">Flex item 2</div>
        <div id="box3" class="box">Flex item 3</div>
        <div id="box4" class="box">Flex item 4</div>
        
        
    </div>
</body>
</html>
