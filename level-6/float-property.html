<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Property</title>
    <style>
        #container{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            background-color: lightgray;
        }
        .box{
            width: 200px;
            height: 100px;
            background-color: green;
             border: 1px solid black;
             float: right;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="container" >
        <div id="box1" class="box">Box 1</div>
    </div>
</body>
</html>
