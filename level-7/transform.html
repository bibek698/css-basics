<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            position: relative;
            top: 50px;
            left: 50px;
            margin: 20px;
           

        }
        .box:hover {
            transform: rotate(45deg);
            transition: transform 0.5s ease-in-out;
        }
        #box2:hover {
            transform: scale(2);
            transition: transform 0.5s ease-in-out;
        }
        #box3:hover {
            transform: translate(50px, 50px); /* x-axis, y-axis */
            transition: transform 0.5s ease-in-out;
        }
        #box4:hover {
            transform: skew(20deg, 10deg); /* x-axis, y-axis */
            transition: transform 0.5s ease-in-out;
        }
        #box5:hover {
            transform: skewX(45deg); /* x-axis */
            transition: transform 0.5s ease-in-out;
        }
    </style>
</head>

<body>

    <div class="box">Rotate</div>
    <div class="box" id="box2">Scale twice</div>
    <div class="box" id="box3">Translate</div>
    <div class="box" id="box4">Skew</div>
    <div class="box" id="box5">Skew 2</div>

</body>
</html>
