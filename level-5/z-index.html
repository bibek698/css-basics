<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z index</title>
    <style>
        div{
            height: 70px;
            width: 70px;
            margin: 5px;
            position: absolute;
        }
        #box1{
            background-color: red;
            z-index: 2;
            top: 10px;
            left: 30px;

        }
        #box2{
            background-color: blue;
            z-index: 1;
            top: 20px;
            left: 60px;
        }
    </style>
</head>
<body>
    <div id="box1">z index 1</div>
    <div id="box2">z index 2</div>
    
</body>
</html>
