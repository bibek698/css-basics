<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative unit: em</title>
    <style>
        #first{
            height: 200px;
            width: 200px;
            background-color: aqua;
            font-size: 10px;
        }
        #second{
            height: 50%; /* take 50% height of parents block if parent not available takes from document size*/
            width: 50%;
            background-color: red;

            font-size: 2.5em; /* parents font size times 2.5 therefore it is 25px*/
        }

    </style>
</head>
<body>
    <div id="first">
        First Div
        <div id="second">
            Second Div
        </div>
    </div>
    
</body>
</html>
